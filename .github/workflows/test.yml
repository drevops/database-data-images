name: Test

on:
  pull_request:
    branches:
      - main
      - 'feature/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test MariaDB, Arch amd64
            engine: mariadb
            dockerfile: mariadb/10.11.Dockerfile
            arch: amd64
            os: ubuntu-latest
            container: ''
          - name: Test MariaDB, Arch arm64
            engine: mariadb
            dockerfile: mariadb/10.11.Dockerfile
            arch: arm64
            os: ubuntu-24.04-arm
            container: ''
          - name: Test MySQL, Arch amd64
            engine: mysql
            dockerfile: mysql/8.4.Dockerfile
            arch: amd64
            os: ubuntu-latest
            container: ''
          - name: Test MySQL, Arch arm64
            engine: mysql
            dockerfile: mysql/8.4.Dockerfile
            arch: arm64
            os: ubuntu-24.04-arm
            container: ''
          # The custom runner jobs validate the containerised CI environment
          # that consumer projects run the seeding in. Linting and coverage
          # run only in these jobs because the ci-runner image bundles shfmt
          # and kcov.
          - name: Test MariaDB, Arch amd64, custom runner
            engine: mariadb
            dockerfile: mariadb/10.11.Dockerfile
            arch: amd64
            os: ubuntu-latest
            # https://hub.docker.com/r/drevops/ci-runner
            container: drevops/ci-runner:26.11.0@sha256:a11a888b3e6d713a12a6e18fffefbf5710634b894851d45322f5872c7f990a14
          - name: Test MySQL, Arch amd64, custom runner
            engine: mysql
            dockerfile: mysql/8.4.Dockerfile
            arch: amd64
            os: ubuntu-latest
            # https://hub.docker.com/r/drevops/ci-runner
            container: drevops/ci-runner:26.11.0@sha256:a11a888b3e6d713a12a6e18fffefbf5710634b894851d45322f5872c7f990a14

    runs-on: ${{ matrix.os }}

    container: ${{ matrix.container }}

    steps:
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint shell scripts
        if: matrix.container != ''
        run: |
          shfmt -i 2 -ci -s -d mariadb/seed.mariadb.sh mysql/seed.mysql.sh tests/bats/*.bash tests/bats/*.bats
          shellcheck mariadb/seed.mariadb.sh mysql/seed.mysql.sh tests/bats/*.bash tests/bats/*.bats
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Install Goss
        run: |
          GOSS_VERSION=v0.4.9
          mkdir -p "${HOME}/bin"
          curl -fsSL "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss-linux-${GOSS_ARCH}" -o "${HOME}/bin/goss"
          curl -fsSL "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/dgoss" -o "${HOME}/bin/dgoss"
          chmod +rx "${HOME}/bin/goss" "${HOME}/bin/dgoss"
          "${HOME}/bin/goss" --version
        env:
          GOSS_ARCH: ${{ matrix.arch }}

      - name: Build Docker image
        run: docker build -t gosstestorg/gosstestimage:goss-test-tag -f "${DOCKERFILE}" "${ENGINE}"
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ENGINE: ${{ matrix.engine }}

      - name: Run Goss tests
        run: |
          export GOSS_FILES_STRATEGY=cp
          export GOSS_PATH="${HOME}/bin/goss"
          GOSS_FILES_PATH="tests/dgoss/${ENGINE}" "${HOME}/bin/dgoss" run -i gosstestorg/gosstestimage:goss-test-tag
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Install BATS dependencies
        run: npm --prefix tests/bats ci

      - name: Run BATS tests with code coverage
        if: matrix.container != ''
        run: |
          echo "${DOCKER_PASS}" | docker login --username "${DOCKER_USER}" --password-stdin
          kcov --include-pattern=.sh,.bash --bash-parse-files-in-dir=. --exclude-pattern=vendor,node_modules,coverage "$(pwd)/coverage" tests/bats/node_modules/.bin/bats tests/bats/helper.bats tests/bats/seed-surface.bats "tests/bats/image.${ENGINE}.bats" "tests/bats/seed.${ENGINE}.bats"
        shell: bash
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          ENGINE: ${{ matrix.engine }}

      - name: Run BATS tests
        if: matrix.container == ''
        run: |
          echo "${DOCKER_PASS}" | docker login --username "${DOCKER_USER}" --password-stdin
          tests/bats/node_modules/.bin/bats tests/bats/helper.bats tests/bats/seed-surface.bats "tests/bats/image.${ENGINE}.bats" "tests/bats/seed.${ENGINE}.bats"
        shell: bash
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          ENGINE: ${{ matrix.engine }}

      - name: Upload coverage report as an artifact
        if: matrix.container != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.job }}-${{ matrix.engine }}-code-coverage-report
          include-hidden-files: true
          path: coverage
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        if: matrix.container != '' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          directory: coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  push-canary-to-registry:
    name: Push canary, ${{ matrix.engine }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    needs:
      - test

    strategy:
      fail-fast: false
      matrix:
        include:
          # The old image name stays an identical copy of the MariaDB image
          # until 1 March 2027.
          - engine: mariadb
            dockerfile: mariadb/10.11.Dockerfile
            images: |
              drevops/db-data-mariadb-10.11
              drevops/mariadb-drupal-data
          - engine: mysql
            dockerfile: mysql/8.4.Dockerfile
            images: |
              drevops/db-data-mysql-8.4

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.images }}
          tags: type=raw,value=canary

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.engine }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
